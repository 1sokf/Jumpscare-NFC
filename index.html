<!DOCTYPE html>
<html lang="fr">

<head>

    <title>Halloween</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
        }

        .scare {
            position: fixed;
            top: 0;

            width: 100vw;
            height: 100vh;

        video {

        video.play().catch(() => {});
    </script>

</body>

</html>
